name: CI

# Lance la suite de tests à chaque poussée sur main et à chaque pull request.
# Prouve la compatibilité annoncée dans le README (Python 3.10 ou plus récent).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le workflow n'a besoin que de lire le dépôt (aucune écriture, aucun secret).
permissions:
  contents: read

# Une nouvelle poussée sur une branche annule le run précédent encore en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # une version qui échoue n'annule pas les autres : on voit tout
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m unittest discover -s tests
